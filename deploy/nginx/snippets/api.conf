# Locations of the API host: the application, map tiles and map style files.

client_max_body_size 110m;
limit_conn per_ip 50;

location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# The bank retries on any non-200 answer: never rate-limit its notifications.
location = /v1/payments/tbank/notifications {
    include /etc/nginx/snippets/proxy.conf;
}

location ^~ /v1/admin/auth/ {
    limit_req zone=admin_login burst=5 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}

# Audio and images: many parallel range requests while a tour downloads.
location ^~ /v1/media/ {
    limit_req zone=media burst=200 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}

location ^~ /v1/admin/media {
    limit_req zone=api burst=40 nodelay;
    # Large uploads stream to the API instead of being buffered here first.
    proxy_request_buffering off;
    include /etc/nginx/snippets/proxy.conf;
}

location / {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/proxy.conf;
}

include /etc/nginx/snippets/maps.conf;
