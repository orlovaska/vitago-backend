name: Docker smoke

on:
  push:
    branches-ignore:
      - release
  pull_request:
  workflow_call:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate throwaway secrets
        run: bash scripts/ci-prepare-secrets.sh

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Smoke checks
        run: |
          curl -fsS http://127.0.0.1/nginx-health
          curl -fsS http://127.0.0.1/health/ready
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1/v1/app | grep -q '^400$'
          test "$(docker compose ps -a --format '{{.Service}} {{.ExitCode}}' | awk '$1=="migrate"{print $2}')" = 0

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - if: always()
        run: docker compose down -v
