name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck, lint, formatting, module boundaries, unit tests.
      - run: npm run check

      - run: npm run build

      # End-to-end tests on a Postgres 18 testcontainer (Docker is available on the runner).
      - run: npm run test:e2e

      - name: Export the API contract
        run: npm run openapi:export

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
