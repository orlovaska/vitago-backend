# The vitago-web single-page site: payment result pages, tour links, legal pages.
root /var/www/site;

# App Links and Universal Links verification files.
location ~ ^/\.well-known/(assetlinks\.json|apple-app-site-association)$ {
    default_type application/json;
    add_header Cache-Control "max-age=300";
    try_files $uri =404;
}

# A shared tour link: the API renders the page, so that link previews in
# messengers get Open Graph tags the SPA cannot give them.
location ~ ^/app/[^/]+/tours/[^/]+/?$ {
    rewrite ^/app/(.*)$ /v1/share/$1 break;
    include /etc/nginx/snippets/proxy.conf;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
