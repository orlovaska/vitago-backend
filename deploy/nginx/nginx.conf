user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types application/json application/problem+json application/javascript
               text/css text/plain image/svg+xml application/x-protobuf;

    # Requests per client IP. Admin sign-in is the tightest; map tiles the loosest,
    # because one screen of a map is dozens of tiles.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=media:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=tiles:10m rate=200r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;

    include /etc/nginx/conf.d/*.conf;
}
