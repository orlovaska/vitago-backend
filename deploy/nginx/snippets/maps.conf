# Vector tiles (martin) and the MapLibre style with its fonts and sprites.
# The data lives outside the repository (/srv/tiles, /srv/maps) and survives deploys.
# Apps load the style URL from their configuration, so a new style needs no release.

location ~ ^/tiles/(?<tiles_path>.*)$ {
    limit_req zone=tiles burst=800 nodelay;

    # Resolve martin at request time, so nginx starts even while martin is down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $martin http://martin:3000;
    proxy_pass $martin/$tiles_path$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Makes martin write /tiles/-prefixed URLs into its TileJSON.
    proxy_set_header X-Rewrite-URL $request_uri;

    add_header Cache-Control "public, max-age=604800" always;
    add_header Access-Control-Allow-Origin "*" always;
}

# Style files change when the map is restyled: a short cache lets a change
# reach every device within minutes.
location ~ ^/maps/(?<style_file>style-[a-z0-9-]+\.json)$ {
    alias /srv/maps/$style_file;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
}

location /maps/fonts/ {
    alias /srv/maps/fonts/;
    default_type application/x-protobuf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header Access-Control-Allow-Origin "*" always;
}

location /maps/ {
    alias /srv/maps/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800" always;
    add_header Access-Control-Allow-Origin "*" always;
}
